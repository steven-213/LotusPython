{% extends "base_public.html" %}

{% block title %}Nueva Compra - Administración{% endblock %}


{% block content %}

<div class="container mt-4">
    <div class="row">
        <div class="col-md-10 offset-md-1">

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="bi bi-plus-circle"></i> Nueva Compra
                </h4>
            </div>

            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <!-- Información General -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">Información de la Compra</h5>
                        </div>

                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Proveedor *</label>
                                    <select id="proveedor-select" class="form-control" name="proveedor_id" required>
                                        <option value="">-- Seleccionar Proveedor --</option>
                                        {% for proveedor in proveedores %}
                                            <option value="{{ proveedor.id }}">
                                                {{ proveedor.nombre }} ({{ proveedor.empresa }})
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Número de Factura</label>
                                    <input type="text" class="form-control" name="numero_factura" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Productos -->
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between">
                            <h5 class="mb-0">Productos</h5>
                            <button type="button" class="btn btn-sm btn-success" onclick="agregarProducto()">
                                + Agregar
                            </button>
                        </div>

                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>Producto</th>
                                            <th>Cantidad</th>
                                            <th>Precio</th>
                                            <th>Impuesto (%)</th>
                                            <th>Margen (%)</th>
                                            <th>Lote</th>
                                            <th>Subtotal</th>
                                            <th></th>
                                        </tr>
                                    </thead>

                                    <tbody id="productos-lista">
                                        <tr class="producto-row">
                                            <td>
                                                <select name="productos_ids[]" class="form-control producto-select">
                                                    <option value="">-- Seleccionar --</option>
                                                    {% for producto in productos %}
                                                        <option value="{{ producto.id }}"
                                                                data-proveedor="{{ producto.proveedor_id }}"
                                                                data-precio="{{ producto.precio_compra }}"
                                                                data-impuesto="{{ producto.impuesto }}"
                                                                data-margen="{{ producto.margen_ganancia }}">
                                                            {{ producto.nombre }}
                                                        </option>
                                                    {% endfor %}
                                                </select>
                                            </td>

                                            <td>
                                                <input type="number" name="cantidades[]" class="form-control cantidad" value="1" min="1">
                                            </td>

                                            <td>
                                                <input type="number" name="precios[]" class="form-control precio" step="0.01" value="0">
                                            </td>

                                            <td>
                                                <div class="input-group">
                                                    <input type="number" name="impuestos[]" class="form-control impuesto" step="0.01" value="19">
                                                    <span class="input-group-text" style="background-color: #fbcdd9; border-color: #ca6b86;">%</span>
                                                </div>                                             
                                            </td>

                                            <td>
                                                <div class="input-group">
                                                    <input type="number" name="margenes[]" class="form-control margen" step="0.01" value="20">
                                                    <span class="input-group-text" style="background-color: #fbcdd9; border-color: #ca6b86;">%</span>
                                                </div>
                                            </td>

                                            <td>
                                                <input type="text" name="lotes[]" class="form-control lote" required>
                                            </td>

                                            <td>
                                                <span class="subtotal">$0.00</span>
                                            </td>

                                            <td>
                                                <button type="button" class="btn btn-danger btn-sm" onclick="eliminarProducto(this)">X</button>
                                            </td>
                                        </tr>
                                    </tbody>

                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Total -->
                    <div class="text-end mb-4">
                        <label>Total:</label>
                        <input type="number" id="total" name="total" class="form-control text-end" readonly>
                    </div>

                    <!-- Botones -->
                    <div class="text-end">
                        <a href="{% url 'inventario:compra_lista' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>


</div>

<script>

function agregarProducto() {
    const container = document.getElementById('productos-lista');
    const row = container.querySelector('.producto-row').cloneNode(true);

    row.querySelectorAll('input, select').forEach(el => {
        el.value = '';
    });

    row.querySelector('.cantidad').value = 1;
    row.querySelector('.subtotal').textContent = '$0.00';

    container.appendChild(row);

    agregarEventosProducto(row);

    const proveedorId = document.getElementById('proveedor-select').value;

    if (proveedorId) {
        row.querySelectorAll('option').forEach(option => {
            if (!option.value) return;

            option.style.display = option.dataset.proveedor === proveedorId ? 'block' : 'none';
        });
    }
}

function eliminarProducto(btn) {
    const filas = document.querySelectorAll('.producto-row');
    if (filas.length > 1) {
        btn.closest('tr').remove();
        actualizarTotal();
    }
}

function agregarEventosProducto(row) {
    const producto = row.querySelector('.producto-select');
    const cantidad = row.querySelector('.cantidad');
    const precio = row.querySelector('.precio');
    const impuesto = row.querySelector('.impuesto');
    const margen = row.querySelector('.margen');

    producto.addEventListener('change', function() {
        const option = this.selectedOptions[0];

        precio.value = option.dataset.precio || 0;
        impuesto.value = option.dataset.impuesto || 0;
        margen.value = option.dataset.margen || 0;

        actualizarSubtotal(row);
    });

    [cantidad, precio].forEach(el => {
        el.addEventListener('input', () => actualizarSubtotal(row));
    });
}

function actualizarSubtotal(row) {
    const cantidad = parseFloat(row.querySelector('.cantidad').value) || 0;
    const precio = parseFloat(row.querySelector('.precio').value) || 0;

    const subtotal = cantidad * precio;

    row.querySelector('.subtotal').textContent = '$' + subtotal.toFixed(2);
    actualizarTotal();
}

function actualizarTotal() {
    let total = 0;

    document.querySelectorAll('.subtotal').forEach(el => {
        total += parseFloat(el.textContent.replace('$', '')) || 0;
    });

    document.getElementById('total').value = total.toFixed(2);
}

document.getElementById('proveedor-select').addEventListener('change', function () {
    const proveedorId = this.value;

    document.querySelectorAll('.producto-select').forEach(select => {

        const opciones = select.querySelectorAll('option');

        opciones.forEach(option => {
            if (!option.value) return;

            if (option.dataset.proveedor === proveedorId) {
                option.style.display = 'block';
            } else {
                option.style.display = 'none';
            }
        });

        select.value = "";
    });
});

document.addEventListener('DOMContentLoaded', () => {
    agregarEventosProducto(document.querySelector('.producto-row'));
});

</script>

{% endblock %}
